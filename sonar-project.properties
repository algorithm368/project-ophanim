# Pins local `sonar` CLI scans to the same SonarCloud project the CI job reports
# into. Without this, a local scan auto-provisions a second project under a bare
# `project-ophanim` key, and its issue list then diverges from the real one
# without ever saying so.
sonar.projectKey=algorithm368_project-ophanim
sonar.organization=algorithm368

# The `sonar` job in .github/workflows/ci.yml analyses every push and PR using
# these settings, so a local scan is only ever a convenience.
#
# Automatic Analysis must be switched off for this project. The two are mutually
# exclusive, and not politely so: SonarCloud refuses a CI analysis outright while
# Automatic Analysis is enabled rather than yielding to it. CI is then the only
# thing analysing this repo, so if the `sonar` job is removed or SONAR_TOKEN
# expires, nothing takes over.

# --- What gets analysed -----------------------------------------------------
# Listed explicitly rather than `sonar.sources=.` so the scanner never wanders
# into the design-sync scratch directories. Those are gitignored, vendored or
# generated, and not this project's code.
sonar.sources=app,components,lib,scripts
sonar.tests=lib
sonar.test.inclusions=lib/**/*.test.ts

# app/favicon.ico is a 400KB binary. The scanner reads it as UTF-8 text and
# warns on every run about an invalid character, which is noise that trains you
# to skip the warnings that matter.
sonar.exclusions=app/favicon.ico

# --- Coverage ---------------------------------------------------------------
# Written by `bun run coverage`, whose provider/reporter/include settings live
# in vitest.config.ts. The scanner reads this report as it analyses; a missing
# file is silently treated as 0% coverage, so the coverage step must run first.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from the coverage metric only. These files are still analysed for
# issues; they are listed because coverage cannot meaningfully be measured:
#
#   app/ and components/ are routing wiring and JSX. The route files are thin
#   shells over lib/ti/route-handler.ts, which is in scope and tested; the
#   components are rendering, checked in a browser rather than in Vitest.
#
#   scripts/ holds Playwright screenshot helpers, which are the verification
#   tool, not the thing verified.
#
# Everything in lib/ stays in scope deliberately: that is where this project's
# convention puts tests, and that is where the parsing, scoring and adapter
# logic lives. The number is genuinely below 100% today, mostly in
# lib/ti/**/sources/*, and it should read that way rather than be excluded into
# looking clean.
sonar.coverage.exclusions=\
    app/**,\
    components/**,\
    scripts/**,\
    lib/**/*.test.ts
