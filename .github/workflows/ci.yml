name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Matches the runtime the Vercel Functions run on (bunVersion in
          # vercel.json), so a lockfile that resolves here resolves there.
          bun-version: latest
      # --frozen-lockfile makes an out-of-date bun.lock a failure rather than a
      # silent resolve. --ignore-scripts keeps package lifecycle scripts from
      # running on install; the only one this repo defines is `prepare`, which
      # points git at .githooks and is meaningless on a runner.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # Last, because it is the slowest and the three checks above localise a
      # failure better than a build log does.
      - run: bun run build

  # Its own job, and the token is scoped to the step that needs it rather than
  # to the job, so `bun install` and the coverage run never have SONAR_TOKEN in
  # their environment. Not gated on `check`: analysis of broken code is still
  # worth having.
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar attributes lines to commits and works out what counts as new
          # code from history; a shallow clone degrades both.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --ignore-scripts
      # Writes coverage/lcov.info, which sonar-project.properties points at.
      # Runs before the scan because the scanner reads the report as it
      # analyses; a missing report is silently treated as 0% coverage.
      - run: bun run coverage
      # The secrets context cannot be read from an `if:`, so whether the token
      # exists becomes a step output instead. Skipping rather than failing keeps
      # the repo mergeable before the secret is added; the warning is what stops
      # a skipped scan reading as a clean one.
      - id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=SonarQube analysis skipped::SONAR_TOKEN is not set on this repository, so no analysis ran. Add the secret to enable it."
          fi
      - name: SonarQube scan
        if: steps.guard.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Pinned to a commit rather than the v8.2.1 tag: a tag can be repointed
        # at new code, so pinning by tag trusts whoever can move it. Bump both
        # the SHA and the comment together.
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
