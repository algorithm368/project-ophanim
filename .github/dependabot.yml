# Dependency updates.
#
# The ecosystem must be `bun`, not `npm`. This was `npm` first, on the wrong
# assumption that it was the thing reading bun.lock, and the result was three
# pull requests (#8, #9, #10) that edited package.json and left the lockfile
# untouched. Every one of them failed CI on the first step:
#
#     error: lockfile had changes, but lockfile is frozen
#
# Dependabot has supported bun since February 2025 and reads the text-based
# bun.lock (Bun 1.1.39+, which is what this repo has; the old binary bun.lockb
# is not supported). Under `bun` it updates the manifest and the lockfile
# together, which is what --frozen-lockfile in CI requires.
#
# The grouping exists so a failure is legible. A grouped PR installs as one
# unit, which means a package nothing else is ready for takes the whole group
# down with it and hides which one broke.
#
#   framework  next and eslint-config-next move in lockstep: the config package
#              is version-matched to the framework, and package.json pins it
#              exactly for that reason. Bumping one without the other is how you
#              get a lint run that disagrees with the build. next is also on a
#              preview tag right now, so this PR is the one worth reading.
#   react      react and react-dom are pinned to the same exact version and are
#              meaningless apart.
#   tooling    everything else is build and test machinery: real enough to keep
#              current, not worth a pull request each.
#
# toolchain is the group learned from PR #14, which bumped ten packages at once
# and failed `bun run lint`. A grouped PR installs as one unit, so a package
# nothing else is ready for takes the whole group down with it and hides which
# one broke. Reproducing #14 with one package reverted at a time found two
# independent breakages, neither of them the eight that came along for the ride:
#
#   eslint 9 -> 10      crashes eslint-plugin-react, which arrives via
#                       eslint-config-next:
#                       "TypeError: Cannot read properties of undefined
#                       (reading 'Cjs')"
#   typescript 5 -> 7   crashes @typescript-eslint/typescript-estree, which
#                       peers on `typescript >=4.8.4 <6.1.0`. Note that `tsc
#                       --noEmit` itself passes on 7; it is only the lint that
#                       cannot load.
#
# With just those two held back, the other eight bumps pass lint, typecheck and
# all 712 tests. So they fail alone, and their majors are ignored outright:
# neither eslint-plugin-react nor typescript-eslint has published anything that
# accepts the new major, and a weekly PR that cannot pass is noise. Lift each by
# re-checking the peer range:
#
#   npm view typescript-eslint peerDependencies
#   npm view eslint-plugin-react peerDependencies
#
# Minor and patch updates inside 9.x and 6.x still arrive. typescript sits at
# ~6.0 because typescript-eslint's range ends below 6.1, so a 6.1 bump fails
# lint the same way until that range moves.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # Matches the kind:* labels the repo uses on issues.
      prefix: chore
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      framework:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      toolchain:
        patterns:
          - typescript
          - eslint
      tooling:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - typescript
          - eslint

  # The CI workflow pins actions by version or SHA; without this they drift
  # untracked until one of them stops working.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
